#:schema https://archival.dev/schemas/archival_editor.schema.json

[[post.views]]
name = "default"
primary = "title"
secondary = "date"
tertiary = "author"

[[post.tag.views]]
name = "default"
primary = "name"

[[author.views]]
name = "default"
primary = "name"
secondary = "role"

[[tag.views]]
name = "default"
primary = "name"
secondary = "description"

[[site.menu_link.views]]
name = "default"
primary = "label"
secondary = "url"

[[site.social.views]]
name = "default"
primary = "label"
secondary = "url"

[[shortcuts]]
name = "New Post"
path = "post"

[[shortcuts]]
name = "New Author"
path = "author"
