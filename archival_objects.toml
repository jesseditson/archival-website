#:schema https://archival.dev/schemas/archival_objects.schema.json
# The content schema. Every type name is singular: root objects are addressed
# by their own name, and lists pluralize themselves in templates.

# The publication. The layout reads it on every page.
[site]
name = "string"
description = "string"
logo = "image"
accent_color = "string"
color_scheme = ["auto", "light", "dark"]
show_scheme_toggle = "boolean"
heading_font = ["sans", "serif"]
body_font = ["serif", "sans"]
featured_heading = "string"
recent_heading = "string"
latest_heading = "string"
read_more_heading = "string"
show_subscribe = "boolean"
subscribe_heading = "string"
subscribe_text = "string"
subscribe_label = "string"
subscribe_url = "string"
og_image = "image"
favicon = "image"

# Extra menu links after the tags shown in the menu, e.g. an About page.
[site.menu_link]
label = "string"
url = "string"

[site.social]
label = "string"
url = "string"

# A story. `author` names an author by name; each tag names a tag by name.
# With a video, feature_image is its poster. link renders as a bookmark card.
[post]
title = "string"
excerpt = "string"
date = "date"
author = "string"
featured = "boolean"
feature_image = "image"
feature_image_alt = "string"
feature_image_caption = "string"
video = "video"
audio = "audio"
audio_title = "string"
content = "markdown"
link = "string"
link_title = "string"
link_description = "string"
template = "post"

[post.tag]
name = "string"

[author]
name = "string"
role = "string"
location = "string"
website = "string"
avatar = "image"
bio = "markdown"
template = "author"

# show_in_menu puts the tag's page in the header and footer menus.
[tag]
name = "string"
description = "string"
show_in_menu = "boolean"
template = "tag"
