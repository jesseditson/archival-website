#:schema https://archival.dev/schemas/archival_objects.schema.json
# The content schema. Every type name is singular.

# The photographer. The layout reads it on every page.
[site]
name = "string"
tagline = "string"
description = "string"
statement = "markdown"
location = "string"
email = "string"
og_image = "image"
favicon = "image"
# Headings and link words. Each has a fallback when left empty.
series_heading = "string"
shows_heading = "string"
contact_heading = "string"
all_series_label = "string"
next_series_label = "string"

[site.social]
platform = ["instagram", "website", "bluesky", "threads", "facebook", "youtube", "vimeo"]
url = "string"
label = "string"

# A body of work. Each one gets its own page at /project/<file>.
[project]
title = "string"
place = "string"
year = "string"
statement = "markdown"
template = "project"

# The photographs in a series, in sequence. The first one stands for the
# series in link previews.
[project.photo]
image = "image"
alt = "string"
caption = "string"

# Exhibitions, books and press.
[show]
year = "string"
title = "string"
venue = "string"
url = "string"
