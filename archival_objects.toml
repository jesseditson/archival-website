#:schema https://archival.dev/schemas/archival_objects.schema.json
# The content schema. Every type name is singular: root objects are addressed
# by their own name, and lists pluralize themselves in templates.

# The identity object. The layout reads it on every page.
[site]
name = "string"
description = "string"
og_image = "image"
favicon = "image"

# A list type, one file per item under objects/<type>/, looks like this.
# `template` makes each item render through pages/<type>.liquid to /<type>/<file>.
# `order` is built in: set it in each item's file, never declare it here.
#
# [post]
# title = "string"
# publish_date = "date"
# body = "markdown"
# template = "post"
