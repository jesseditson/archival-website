#:schema https://archival.dev/schemas/archival_objects.schema.json
# Repertoire: a site for musicians people hire. Every type name is singular.

# The ensemble. The layout reads it on every page.
[site]
name = "string"
tagline = "string"
description = "string"
location = "string"
intro = "markdown"
hero_image = "image"
hero_alt = "string"
# Optional: a short silent loop that plays behind the name. hero_image is
# shown until it loads, and instead of it for visitors who ask for less motion.
hero_video = "video"
# The recording the "Hear us" button plays, and what it is.
sample = "audio"
sample_title = "string"
players_image = "image"
players_alt = "string"
# Behind the kind words.
quote_image = "image"
# The smoke that drifts between scenes: scene_fog at the foot of the opening
# film, program_fog where the maroon program meets the kind words. Each is a
# transparent image (WebP or PNG) four times as wide as it is tall that
# repeats sideways as it drifts; leave empty for no smoke.
scene_fog = "image"
program_fog = "image"
# Section headings and labels. Each has a fallback when left empty.
listen_label = "string"
players_heading = "string"
formats_heading = "string"
repertoire_heading = "string"
kind_words_heading = "string"
concerts_heading = "string"
# The short words in the floating menu.
nav_formats = "string"
nav_repertoire = "string"
nav_concerts = "string"
nav_book = "string"
email = "string"
booking_url = "string"
booking_label = "string"
inquire_heading = "string"
inquire_note = "string"
og_image = "image"
favicon = "image"

[site.social]
platform = ["instagram", "youtube", "facebook", "spotify", "tiktok", "website"]
url = "string"
label = "string"

# Who plays.
[member]
name = "string"
instrument = "string"

# What people can book: Solo, Duo, Quartet.
[format]
name = "string"
players = "string"
fee = "string"
length = "string"
note = "string"

# A part of the day or the program: Ceremony, Cocktail hour, Dinner.
[moment]
name = "string"
note = "string"

# A piece in that part. sample is an optional short recording.
[moment.piece]
title = "string"
composer = "string"
sample = "audio"

# Public concerts.
[concert]
date = "date"
title = "string"
venue = "string"
city = "string"
url = "string"

# What clients said.
[kind_word]
quote = "string"
name = "string"
detail = "string"
