#:schema https://archival.dev/schemas/archival_objects.schema.json
# The content schema. Every type name is singular.

# The photographer. The layout reads it on every page.
[site]
name = "string"
tagline = "string"
description = "string"
booking_status = "string"
hero_image = "image"
hero_alt = "string"
hero_caption = "string"
hello = "markdown"
location = "string"
email = "string"
booking_url = "string"
booking_label = "string"
inquire_heading = "string"
inquire_note = "string"
og_image = "image"
favicon = "image"
# Headings and button words. Each has a fallback when left empty.
inquire_label = "string"
packages_heading = "string"
sessions_heading = "string"
kind_words_heading = "string"
faq_heading = "string"

[site.social]
platform = ["instagram", "pinterest", "facebook", "tiktok", "threads", "bluesky", "youtube", "website"]
url = "string"
label = "string"

# What a client can book. Price is free text, like "From $2,400".
[package]
name = "string"
price = "string"
hours = "string"
summary = "string"

[package.include]
item = "string"

# Recent work, shown as prints. Caption is written on the print, like "Hood River, June".
[shoot]
photo = "image"
alt = "string"
caption = "string"

# What clients said.
[kind_word]
quote = "string"
name = "string"
detail = "string"

[faq]
question = "string"
answer = "markdown"
