#:schema https://archival.dev/schemas/archival_objects.schema.json
# Repertoire: a site for musicians people hire. Every type name is singular.

# The ensemble. The layout reads it on every page.
[site]
name = "string"
tagline = "string"
description = "string"
location = "string"
intro = "markdown"
hero_image = "image"
hero_alt = "string"
# The recording the "Hear us" button plays, and what it is.
sample = "audio"
sample_title = "string"
players_image = "image"
players_alt = "string"
email = "string"
booking_url = "string"
booking_label = "string"
inquire_heading = "string"
inquire_note = "string"
og_image = "image"
favicon = "image"

[site.social]
platform = ["instagram", "youtube", "facebook", "spotify", "tiktok", "website"]
url = "string"
label = "string"

# Who plays.
[member]
name = "string"
instrument = "string"

# What people can book: Solo, Duo, Quartet.
[format]
name = "string"
players = "string"
fee = "string"
length = "string"
note = "string"

# A part of the day or the program: Ceremony, Cocktail hour, Dinner.
[moment]
name = "string"
note = "string"

# A piece in that part. sample is an optional short recording.
[moment.piece]
title = "string"
composer = "string"
sample = "audio"

# Public concerts.
[concert]
date = "date"
title = "string"
venue = "string"
city = "string"
url = "string"

# What clients said.
[kind_word]
quote = "string"
name = "string"
detail = "string"
