#:schema https://archival.dev/schemas/archival_objects.schema.json
# The content schema. Every type name is singular: root objects are addressed
# by their own name, and lists pluralize themselves in templates.
# `order` is built in: set it in each item's file, never declare it here.

# The café itself. The layout reads it on every page.
[site]
name = "string"
tagline = "string"
description = "string"
hero_image = "image"
hero_alt = "string"
# One line. It drives the map and the "Get directions" button.
address = "string"
# Optional: a Google Maps embed link (or the whole embed code) for an exact pin.
map_embed_url = "string"
phone = "string"
email = "string"
# Optional holiday closure. Leave empty when there is none.
closure_start = "date"
closure_end = "date"
closure_note = "string"
og_image = "image"
favicon = "image"

[site.social]
platform = ["instagram", "facebook", "tiktok", "x", "threads", "bluesky", "youtube", "website"]
url = "string"
label = "string"

# The photo strip.
[site.photo]
file = "image"
alt = "string"

# One item per open day. A day without a row is closed.
[hours]
day = ["monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday"]
opens = "string"
closes = "string"

# A menu section, such as Coffee or Pastries, and its items.
[menu_group]
name = "string"
note = "string"

[menu_group.item]
name = "string"
price = "string"
description = "string"
