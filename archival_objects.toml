#:schema https://archival.dev/schemas/archival_objects.schema.json
# Liner Notes: one record is the whole site. Every type name is singular.

# The artist. The layout reads it on every page.
[site]
name = "string"
description = "string"
# The sleeve's colors: cobalt, tangerine, bone or moss.
palette = ["cobalt", "tangerine", "bone", "moss"]
bio = "markdown"
portrait = "image"
portrait_alt = "string"
email = "string"
og_image = "image"
favicon = "image"

[site.social]
platform = ["spotify", "apple-music", "bandcamp", "soundcloud", "youtube", "instagram", "tiktok", "website"]
url = "string"
label = "string"

# The record itself.
[record]
title = "string"
released = "date"
label = "string"
cover = "image"
cover_alt = "string"
blurb = "markdown"
# Headings and labels. Each has a fallback when left empty.
released_label = "string"
play_label = "string"
tracklist_heading = "string"
about_heading = "string"
press_heading = "string"
credits_heading = "string"
track_credits_heading = "string"
lyrics_heading = "string"

# Where to listen or buy: "Bandcamp", "Spotify", "Vinyl".
[record.link]
name = "string"
url = "string"

# One song, in tracklist order. Each gets a page at /track/<file>.
[track]
title = "string"
duration = "string"
audio = "audio"
notes = "markdown"
lyrics = "markdown"
template = "track"

# Who played or did what on this track.
[track.credit]
role = "string"
name = "string"

# The whole record's credits.
[credit]
role = "string"
name = "string"

# What other people said about the record.
[press]
quote = "string"
source = "string"
url = "string"
