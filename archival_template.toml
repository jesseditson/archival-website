#:schema https://archival.dev/schemas/archival_template.schema.json
name = "Byline"
tagline = "An editorial publication with featured stories, author pages, tags and a newsletter signup."
description = """
Byline is a clean, magazine-style home for a writer or a small team. The front page leads with one featured story in large type beside a short stack of recent ones, then lists everything else newest first. Every story gets a focused reading page with its tag, author byline, reading time, a wide feature image or video, an audio player, wide inline photos with captions, link cards, and a "keep reading" row of related stories.

Each author has a profile page with a bio and every story they wrote, and each tag has its own page too. A subscribe band and header button point readers to your newsletter signup page on any service you use.

You choose the accent color, a light, dark or automatic color scheme (and whether visitors get a switch to change it), and whether headings and body text are set in a sans serif or a serif. It also publishes an RSS feed.
"""
context = """
Byline is for a writer-led publication: a personal essay site, a newsletter's archive, a small magazine or a team blog. Pick it when the person writes long-form stories and wants them to read well, with authors and topics.

The site object:
- name: the publication's name, short.
- description: one sentence about what the publication covers. It is the large line at the top of the home page and the default meta description.
- accent_color: a hex color such as "#c8315f" used for buttons, tag labels and author initials. Choose a fairly deep color, since white text sits on it.
- color_scheme: "auto", "light" or "dark", the scheme a first-time visitor sees. Use "auto" (follow the visitor's system) unless asked.
- show_scheme_toggle (boolean): shows a light, dark and system switch in the header so visitors can choose. Default true.
- heading_font: "sans" or "serif". body_font: "serif" or "sans" (the article text).
- featured_heading: the label over the big lead story when a post is marked featured, e.g. "Featured". recent_heading: the label over the column of the newest stories beside it, e.g. "Latest". latest_heading: the heading over the full list of the remaining stories, e.g. "More stories". read_more_heading: the heading over related stories under each post, e.g. "Keep reading".
- show_subscribe (boolean), subscribe_heading, subscribe_text (one or two sentences), subscribe_label (button text) and subscribe_url (the signup page on their newsletter service). Leave subscribe_url blank if you don't know it; the subscribe parts then hide.
- [[menu_link]] child entries with label and url: extra links in the header and footer menus, after the tags shown there. Usually one About link to the main author's page ("/author/<author file name>"). Don't add tag pages here; tags join the menu with show_in_menu.
- [[social]] child entries with label and url for footer links (social profiles, and "RSS" pointing to "/feed.xml").
- logo, og_image and favicon are images. Leave them for the owner.

Each post (objects/post/<slug>.toml):
- title, excerpt (one or two sentences shown under the title and in lists), date (YYYY-MM-DD), author (exactly the name of an author object), featured (true on the one story that should lead the home page; otherwise the newest leads), content (markdown, several paragraphs with a few ## subheadings where natural), and [[tag]] child entries each with a name that exactly matches a tag object's name. Put the main tag first; it is the one shown above the title. Use one to three tags.
- feature_image, feature_image_alt and feature_image_caption: leave the image for the owner, and leave alt and caption blank unless there is an image. When a post has a video, feature_image is the video's poster frame.
- video and audio are uploads: leave them for the owner. audio_title is the line shown on the audio player; leave it blank unless there is audio.
- link, link_title and link_description: an optional external page the story points to, shown as a card under the story. Use a real, well-known URL only when the story clearly refers to one; otherwise leave all three blank.
- Photos inside content are markdown images with absolute URLs. A line in italics directly under an image becomes its caption.
- Write at least six posts with realistic dates spread over recent months, in the publication's voice.

Each author (objects/author/<slug>.toml): name, role (e.g. "Editor"), location, website, bio (markdown, one or two short paragraphs). avatar is an image: leave it for the owner; initials show without it.

Each tag (objects/tag/<slug>.toml): name, description (one sentence) and show_in_menu (boolean: true puts the tag's page in the header and footer menus, in the tags' order; set it on the two or three main tags, false on the rest). Make three to five tags and use each on at least one post.
"""
tags = ["blog", "writing", "publication", "newsletter", "magazine", "essays", "editorial", "authors"]
tlds = ["com", "blog", "news", "press", "pub"]
keep_objects = []
