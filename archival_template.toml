#:schema https://archival.dev/schemas/archival_template.schema.json
name = "Mobile App"
tagline = "A launch page for your app: store buttons, screenshots, and the legal pages Apple asks for."
description = """
This website showcases a mobile app, highlights key features, and contains support email links and example privacy policy and EULA pages for your mobile app. It includes a hero section with app store download buttons, a screenshot carousel with device frame options, and dedicated pages for EULA, Terms of Service, and Privacy Policy.
"""
context = """
This template shows information about an app that is for sale on an app store - for instance google play or the iOS app store. When generating features, for this template, generate 6 of them.

The app object contains: name, hero_supplement, features_title, author, logo (image), og_image (image), description, appstore_download_link, playstore_download_link, direct_download_link, country, and legal_email. If the user hasn't provided store links, leave them empty.

The page headline is the app's own name, so there is no separate tagline to invent here.

hero_supplement is one short line directly under that headline: a kicker of one to three words, like "Introducing". Never a sentence.

features_title is the heading of the features section, and doubles as the navigation label that links to it. One or two words, like "Features". Not a sentence, and not a description of the features.

Each feature has an emoji, an icon (image), a title, and a desc (short description). Use relevant emojis that match each feature's purpose. Keep the title to a few words - it is a label, not a sentence - and keep each desc to 1-2 sentences.

Generate 3-4 screenshots. Each has a description, used as alt text, and a frame, which draws a device around the image. Set frame to match the platform that screenshot actually comes from: iphone-15-portrait for iOS, google-pixel-8-rose-portrait for Android. An iOS screenshot inside the Android frame (or the reverse) is a visible error - if the app only ships on one platform, every frame should be that platform's.

The source material is usually copied from an app store listing, so it often contains emoji shortcodes such as :sunny:, markup fragments such as |h3| or <p>, star ratings, and marketing punctuation. Never carry any of that into your output. Write plain text only.

Do not modify the eula, terms_of_service, or privacy_policy objects - they have template defaults that should be kept.

The support object has title, email and chat_link fields. Fill the email with the same value as legal_email if not otherwise specified.
"""
tags = []
tlds = ["com", "app"]
keep_objects = [
    "eula",
    "terms_of_service",
    "privacy_policy"
]

# ---------------------------------------------------------------------------
# Skin contract
# ---------------------------------------------------------------------------
# Declares what an automated skin pass may change, and what it must not.
#
# Read this alongside app-2's contract — they are deliberately DIFFERENT, and
# the difference is the point.
#
# app-2's `header.hero` has no fixed height and 2.5rem margin-bottom: it is a
# continuous page surface, so its --color-hero-background MUST derive from
# --color-background or the two surfaces band apart.
#
# app-1's `header.hero` is `height: 43rem; margin-bottom: 19rem` with a
# deliberate blue (#184ed8) against an off-white (#f9f9f9) page. That contrast
# is the design. There is therefore NO derive between --color-background and
# --color-hero-background here, and any tool that assumes one globally is wrong.
#
# Anything NOT listed in [skin.variables] is immutable to a skin pass.

[skin]
files = ["public/styles.css"]
selector = ":root"

[skin.variables]
"--color-text" = { type = "color" }
# NOTE: dual-role — also the text colour on --color-hero-background
# (.support-modules .module a). The contrast rule below covers that.
"--color-background" = { type = "color" }
"--color-hero-background" = { type = "color" }
"--color-hero-text" = { type = "color" }
"--color-heading" = { type = "color" }
"--color-footer-text" = { type = "color" }
"--color-supplement" = { type = "color" }
"--typo-h1-size" = { type = "length", min = "3rem", max = "7rem" }
"--typo-h1-weight" = { type = "number", min = 400, max = 900 }
"--typo-h2-size" = { type = "length", min = "2rem", max = "5rem" }

# The hero band and the buttons are ONE accent colour (both #184ed8 in stock) —
# confirmed by Alex, who authored this CSS. Skins set the accent once, via
# --color-hero-background, and the buttons follow.
[[skin.derive]]
var = "--color-button-bg"
from = "--color-hero-background"

# BUG FIX: --color-button-hover-bg is #184ed8 in stock — identical to
# --color-button-bg — so buttons currently have NO visible hover change at all.
# Confirmed a bug, not a choice. Deriving it as a shade fixes the stock template
# AND holds for any accent a skin picks; a fixed hex would break as soon as the
# accent moved. `shade` shifts lightness toward the opposite end (darkens light
# colours, lightens dark ones), matching app-2's stock #000000 -> #161616.
[[skin.derive]]
var = "--color-button-hover-bg"
from = "--color-button-bg"
darken = 0.08

[[skin.contrast]]
fg = "--color-text"
bg = "--color-background"
min = 4.5

[[skin.contrast]]
fg = "--color-hero-text"
bg = "--color-hero-background"
min = 4.5

# --color-background is used as TEXT on the hero band here.
[[skin.contrast]]
fg = "--color-background"
bg = "--color-hero-background"
min = 4.5

[skin.fonts]
stacks = [
    "system-ui, sans-serif",
    "ui-serif, Georgia, serif",
    "ui-monospace, SFMono-Regular, Menlo, monospace",
]
