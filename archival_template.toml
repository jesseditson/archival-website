#:schema https://raw.githubusercontent.com/jesseditson/archival/refs/heads/toml_schemas/archival_template.schema.json
name = "About Me"
description = """
This template is intended to be used for a professional website for an individual.
"""
context = """
This template shows information about a person, and could be generated from a resume or other professional information about a person.
When filling the action_line field, the text will be preceded in the UI by the string "Hi, my name is <something> and ", so make sure it makes grammatical sense when added to that string.
When filling the action_line field, make the action line short and catchy - no more than 10 words.
When filling work.projects, there are some defaults in the template, so just use the defaults if you don't have something appropriate to fill this with.
"""
tags = ["resume", "about"]
tlds = ["com", "me"]
