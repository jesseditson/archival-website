#:schema https://archival.dev/schemas/archival_template.schema.json
name = "Bar & Restaurant"
tagline = "A dark, warm room online — menu, hours, events, and a reservation link."
description = "A dark, sophisticated template for bars and restaurants. Features a centered menu with dotted-leader pricing, events section, and warm gold accent theming. Includes a hero image, polaroid-style gallery images, reservation link, operating hours, and full contact details. The dedicated menu page groups items by category with an elegant dotted-leader price layout."
context = """
This template is designed for upscale bars, cocktail lounges, and contemporary restaurants. It features a dark color scheme with customizable accent color, a dedicated menu page with category navigation, event listings, and all the essential info a venue needs.
The site object has: name (venue name), tagline (short catchphrase), description (markdown about the venue), hero_image, logo, reservation_url, and three polaroid images (polaroid_1, polaroid_2, polaroid_3) for atmospheric gallery shots, each with a matching polaroid_1_description / polaroid_2_description / polaroid_3_description. Those descriptions are the alt text for their image: write a short, literal description of what the photo shows ("the bar at dusk, seen from the entrance"), not a caption and not marketing copy. Leave one empty if its image is absent.
The contact object has: address, phone, email, and instagram handle.
Generate 5-7 hours entries with day (e.g. "Monday - Thursday") and time (e.g. "5pm - 12am"), and a boolean `closed` (set to true on closed days, otherwise omit or false). Group days with the same hours together.
The menu is its own top-level collection: each category lives in its own file under objects/menu/ with a `name` field (the category name, e.g. "Cocktails") and a list of [[menu_item]] entries. Generate 3-4 categories (typically "Cocktails", "Small Plates", "Entrees", "Desserts") and put 2-4 menu items inside each. Each menu_item has: name, description (1 sentence in a refined, appetizing style), price (a string like "$14" or "$18"), and featured (boolean — mark 2-3 items as featured across the whole menu).
Generate 2-3 event entries with title, date (upcoming), markdown description, and optional link.
Use a sophisticated, upscale hospitality tone. Think cocktail menu copywriting — concise, evocative, slightly luxurious.
"""
tags = ["restaurant", "bar", "food", "cocktails", "menu"]
tlds = ["com", "bar", "restaurant", "menu"]
keep_objects = []
