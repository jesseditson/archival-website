#:schema https://archival.dev/schemas/archival_template.schema.json
name = "Tech Product"
tagline = "A dark, one-page launch site for a startup, with glowing glass layers that move."
description = """
A one-page site for a tech startup or product team: AI, developer tools or software as a service. It opens on a calm, near-black screen with a large headline, two buttons, a row of key numbers and a stack of glowing glass layers drawn live in the page, with two frosted cards floating over them.

Below the opening it has a row of customer names, a panel of features, a "How it works" section where one glass layer lights up for each step as you scroll, a large customer quote, a short list of questions and answers, and a closing call to action. The menu scrolls to each section, and each section can be hidden on its own.
"""
context = """
This template is a one-page launch site for a technology product or startup: an AI tool, developer platform, data service or business software. Pick it when the person wants a modern product landing page whose main job is to get visitors to sign up, start a trial or book a demo.

THE OPENING SCREEN HAS VERY LARGE TYPE. Keep it short.

site:
- name: the product or company name, short.
- tagline: one short sentence about the product, used in the footer and in search results.
- description: one or two sentences for search engines and link previews.
- headline_line: the main headline, written as two or three separate items, one per line. Each line is two to four words. Together they read as one short phrase, ending with a period. No exclamation marks.
- subline: one or two sentences under the headline saying what the product does and for whom.
- primary_label and primary_url: the main button, such as "Book a demo" with a mailto: link or a sign-up page. secondary_label and secondary_url: an optional second button such as "Start free"; leave both empty if there is no second action.
- header_cta_label: a short label for the button at the top right, usually the same as primary_label.
- stat: two to four key numbers, each a short value ("600+", "99.95%", "2.4B") and a one- or two-word label. Only use numbers the person has given you; otherwise leave the list empty.
- highlight: exactly two items shown as cards over the artwork. Each has a kicker (one or two words, like "Benchmarking"), a title (under ten words, naming a product or capability), an icon, and an optional url. Only the first two are shown.
- icon values for highlights and features: network, shield, layers, gauge, bolt, lock, search, chart, globe, spark, code, check.
- hero_image and hero_alt: leave empty. The page draws its own artwork.
- logos_heading: a short line above the customer names, like "Teams building on Cairn".
- features_heading and features_intro: a heading (under ten words) and one sentence for the features section.
- how_heading and how_intro: a heading and one or two sentences for the steps section.
- quote_text, quote_name, quote_role: one customer quote of one to three sentences, the person's name, and their role and company. Leave all three empty unless the person gave you a real quote.
- faq_heading: a short heading for the questions.
- closing_heading and closing_text: a final call to action heading (under eight words) and one sentence.
- nav_features, nav_how, nav_customers, nav_faq: one or two words each for the menu.
- show_logos, show_features, show_how, show_quote, show_faq: true unless the person wants a section hidden.
- social: links with a platform (x, github, linkedin, youtube, discord, website) and a url.

logo: customers or partners. Each has a name and a style (bold-italic, wide, caps or plain); vary the styles so the row looks like a set of different wordmarks. Use real customer names only if the person gave them; otherwise leave the list empty.

feature: four to six features. Each has an icon, a title of two to six words, and text of one sentence.

step: three to five steps of how the product works, in order. Each has a one- or two-word title and one or two sentences of text.

faq: four to six questions a buyer would ask, each with a short answer in markdown.
"""
tags = ["startup", "technology", "software", "ai", "saas", "product", "landing page", "dark"]
tlds = ["ai", "io", "dev", "app", "tech", "com"]
keep_objects = []
