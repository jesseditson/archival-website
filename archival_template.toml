#:schema https://raw.githubusercontent.com/jesseditson/archival/refs/heads/toml_schemas/archival_template.schema.json
name = "Podcast"
description = """
This gorgeous template is everything you need to start your own podcast. Just upload podcast content, and this site will automatically generate rss feeds whenever you post episodes. Features host profiles, episode management with tags, customizable colors, and links to all major podcast platforms (Spotify, Apple Podcasts, YouTube, etc.). Each episode gets its own page with show notes, duration, and host attribution.
"""
context = """
This template should be selected for people who want to create a podcast or who upload podcast audio files.
The podcast object has: title (podcast name), subtitle (short tagline), description (markdown — write a compelling 1-2 paragraph pitch for the podcast), logo (image string — leave as default), website_url (leave empty), email (contact email), language (RSS language code like "en-us"), category (an Apple Podcasts category like "Technology", "Arts", "Business", "Comedy", "News", etc. — pick the best fit), explicit (boolean — true if the podcast contains explicit content, otherwise false), and author (the show's creator/host name(s); often differs from title).
Generate 3-5 episode entries. Each has: number (integer, start at 1), title (episode title — make them catchy and topical), slug (url-safe version of title), description (markdown show notes — 2-3 paragraphs summarizing what the episode covers), audio_url (leave empty unless user provides audio), duration (string like "45:30"), publish_date (date — spread over recent weeks), thumbnail (leave empty), featured (boolean — mark 1 episode as featured), draft (boolean — set all to false), tag1 and tag2 (short topic tags), host1 and host2 (must match a host name exactly, host2 can be empty for solo episodes).
Generate 1-2 host entries. Each has: name, bio (markdown — 1-2 paragraph bio), avatar (leave empty), and social links: twitter, linkedin, instagram (leave empty unless user provides these).
The settings object has color customization (primary_color, accent_color, background_color — leave as defaults) and social/platform links: twitter, instagram, tiktok, spotify, apple_podcasts, google_podcasts, youtube. Leave platform links empty unless the user provides them.
Write in an engaging, conversational podcast-host tone. Episode descriptions should tease the content and make listeners want to tune in.
"""
tags = ["podcast"]
tlds = ["com", "me"]
