#:schema https://archival.dev/schemas/archival_template.schema.json
# Shown in the editor's template picker.
name = "Repertoire"
# One line for the gallery card, roughly ten to fifteen words.
tagline = "A dark, cinematic site for musicians people hire for weddings, events and concerts."
# The describe box on the confirm screen.
describe_title = "Tell us about your ensemble"
describe_placeholder = "We're a string quartet in the Hudson Valley. We play weddings and parties, solo cello up to full quartet, from $450. Classical plus pop arrangements."
describe_files = "Drop photos of you playing and a few short recordings"
# The template info modal's body: what this template is and what it contains.
description = """
A site for musicians who get booked: a string quartet, a jazz trio, a pianist or a harpist who plays weddings, events and concerts. It opens like a film: a full-screen loop of you playing (or a photo) behind your name, set half in a light serif and half in bold capitals, with a frosted-glass button that plays a recording of you. Smoke dissolves into a full-screen photo of the players and a short note about you, then a deep maroon program: your formats and fees, and your repertoire grouped by the part of the day it suits, each piece with an optional short recording that plays in a floating glass player. Kind words from clients fade one into the next over a full-screen photo, followed by upcoming concerts and an invitation to email you or check a date. Sections fade up as they scroll into view.
"""
# The prompt that drives content generation. Describe when to pick this
# template and what every field holds. Update it whenever the schema changes.
context = """
Pick this template for musicians whose site's job is getting booked: a string quartet, a jazz or folk trio, a solo pianist, harpist or singer who plays weddings, private events and concerts. For an artist promoting a record or a career of releases and tours, a record or band template fits better.

Write only from facts the person gave you. Fees, what a format includes, concert dates and venues are promises to real clients, so when the person has not given them, leave them empty and the page leaves those parts out. Never invent client quotes, players' names or recordings.

site (the ensemble):
- name: the ensemble's or musician's name. It is the page's only h1, set very large over the hero: its last word in bold capitals and the words before it in a light serif ("The Quarry Light" / "Quartet"), so a name ending in "Quartet", "Trio" or "Strings" reads well.
- tagline: one line under the name, around eight to fourteen words ("A string quartet for weddings, celebrations and concerts in the Hudson Valley").
- description: one or two sentences for search results and link previews.
- location: where they are based or play ("Hudson Valley, New York").
- intro: a short markdown paragraph in the first person plural (or singular for a soloist) about who they are and how they work. No headings.
- hero_image, hero_alt: leave both empty. The full-screen photo behind the name.
- hero_video: leave empty. An optional short silent loop that plays behind the name; hero_image shows until it loads.
- sample: leave empty unless the person uploaded a recording. sample_title names that recording, composer then piece ("Borodin, Nocturne from String Quartet No. 2"); leave it empty when there is no sample.
- players_image, players_alt: leave both empty. The full-screen photo behind the note on the players.
- quote_image: leave empty. The full-screen photo behind the kind words.
- scene_fog, program_fog: leave empty. Transparent smoke images that fade one section into the next.
- Headings and labels, each short and in the ensemble's voice; leave any of them empty to use the wording shown here: listen_label, the text of the button that plays the sample ("Hear us play"); players_heading ("The players"); formats_heading ("Formats & fees", an ampersand is set in italic); repertoire_heading ("Repertoire"); kind_words_heading ("Kind words", read by screen readers only); concerts_heading ("Concerts").
- The floating menu's words, one or two words each: nav_formats ("Formats"), nav_repertoire ("Repertoire"), nav_concerts ("Concerts"), nav_book ("Book"). A menu link only shows when its section has content.
- email: only an address the person gave. booking_url: only a booking or inquiry page URL they gave, written in full with https://. booking_label: the booking button's text ("Check a date"); leave empty when there is no booking_url.
- inquire_heading: the closing heading ("Tell us about the day"). inquire_note: one or two sentences on what to send and how soon they reply.
- og_image, favicon: leave empty.
- social: one entry per account the person gave. platform is one of "instagram", "youtube", "facebook", "spotify", "tiktok" or "website"; url is the full URL; label is the account's name for screen readers (the button shows only the icon). Never invent URLs.

member (who plays): name and instrument ("Viola"). Only real players the person named; leave member empty for a soloist who did not give one.

format (what can be booked): name ("Duo"), players as text ("Violin and cello"), fee as text the way they write it ("From $750"), length ("Up to two hours"), and a one-sentence note on when it suits. Set order from smallest to largest.

moment (a part of the day or the program, such as "Ceremony", "Cocktail hour", "Dinner", "First dance", or for concerts "Classical", "Jazz standards"): name and a one-sentence note. piece is the list of pieces for that moment, each with title, composer (or songwriter, adding "arranged by us" for their own arrangements), and sample, a short recording, left empty unless the person uploaded one. Use only pieces the person said they play.

concert (public dates): date, title, venue, city ("Hudson, NY") and url for tickets or details. Only real dates the person gave.

kind_word (what clients said): quote, name ("Maya and Jo") and detail ("Married in Germantown"). Only real quotes the person gave.
"""
tags = ["music", "musician", "string quartet", "wedding music", "ensemble", "booking", "events", "concerts", "audio"]
tlds = ["music", "band", "events", "com"]
assets = ["CREDITS.md"]
# Nothing is kept: a new site starts without the example quartet's players,
# repertoire, recordings or quotes.
keep_objects = []
