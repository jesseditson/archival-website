#:schema https://raw.githubusercontent.com/jesseditson/archival/refs/heads/toml_schemas/archival_template.schema.json
name = "App"
description = """
This website showcases a mobile app, highlights key features, and contains support email links and example privacy policy and EULA pages for your mobile app. This variant features a tagline field, icon-based features with a rich icon picker, and Discord support link integration.
"""
context = """
This template shows information about an app that is for sale on an app store - for instance google play or the iOS app store.

The app object contains: name, tagline, hero_description, author, logo (image), og_image (image), description, appstore_download_link, playstore_download_link, direct_download_link, country, and legal_email. If the user hasn't provided store links, leave them empty.

BREVITY IS THE POINT OF THIS TEMPLATE. Its type is very large, and every text field below is rendered at display size in a narrow column. Text that reads as a normal sentence length in a document overflows here and looks broken. When in doubt, write less.

tagline is the page's main headline, rendered as the h1 at the largest type on the page. Maximum five words. It must be a short, calm phrase - not a sentence, not two clauses joined by a separator such as "|" or a dash, and never with an exclamation mark. Write it fresh for this specific app, in words drawn from what the app actually does; do not fall back on a stock formula such as "Built for ..." or "Your ... companion". Bad: "Clear Sound, Clear Water! | Eject Dust & Water Effortlessly" - too long, two clauses, a separator, and an exclamation mark.

hero_description is ONE short supporting sentence beneath the headline. Do not repeat the description text here.

description is the longer body paragraph about the app: two or three sentences.

Generate 6 features. A feature has exactly two fields: icon and title. THERE IS NO DESCRIPTION FIELD ON A FEATURE. Do not write one, and do not append explanatory text, a second clause, or a separator to the title in order to fit one in. title is a label of two to four words - a short noun phrase, like "Offline downloads", "Sleep timer", "Your data is yours" - with no ending punctuation, no exclamation mark, no separator character, and no sentence. A title longer than five words is wrong.

Pick each icon from the predefined set of icon names (covering nature, animals, food, people, tools, science, transportation, objects, communication, business, education, entertainment, health, lifestyle, security, and miscellaneous) so that it best represents its feature.

The source material is usually copied from an app store listing, so it often contains emoji, emoji shortcodes such as :sunny:, markup fragments such as |h3| or <p>, star ratings, and marketing punctuation. Never carry any of that into your output. Write plain text only.

Generate 3-4 screenshots.

Do not modify the eula, terms_of_service, or privacy_policy objects - they have template defaults that should be kept.

The support object has title, description, email, chat_link, chat_label, and discord_link fields. Fill the email with the same value as legal_email if not otherwise specified. Leave discord_link empty unless the user mentions Discord.
"""
tags = []
tlds = ["com", "app"]
keep_objects = [
    "eula",
    "terms_of_service",
    "privacy_policy"
]

# ---------------------------------------------------------------------------
# Skin contract
# ---------------------------------------------------------------------------
# Declares what an automated skin pass may change, and what it must not.
#
# Motivation: the lead-gen skin pass (aider, via `archival-utility preview
# generate`) has unrestricted write access to this stylesheet. In the journal/US
# batch it desynchronised the three variables that encode ONE colour below,
# producing a visible banding stripe under the hero on 2 of 5 generated sites.
# Nothing in the pipeline caught it before those sites were built and
# screenshotted for outreach.
#
# Anything NOT listed in [skin.variables] is immutable to a skin pass.

[skin]
files = ["public/styles.css"]
selector = ":root"

# Variables a skin may set freely.
[skin.variables]
"--color-text" = { type = "color" }
# NOTE: --color-background is dual-role. It is the page surface AND the text
# colour on --color-button-bg (see .skip-link, .support-modules .module a,
# .not-found-cta). The contrast rule below covers that second role.
"--color-background" = { type = "color" }
"--color-heading" = { type = "color" }
"--color-footer-text" = { type = "color" }
"--color-supplement" = { type = "color" }
# The "ink" colour: button fill, link text, and (via the derive below) the hero
# button fill and headline. Confirmed by Alex as ONE intentional colour, not a
# coincidence of the stock black-and-white palette.
"--color-button-bg" = { type = "color" }
"--typo-h1-size" = { type = "length", min = "3rem", max = "8rem" }
"--typo-h1-weight" = { type = "number", min = 400, max = 900 }
"--typo-h2-size" = { type = "length", min = "2rem", max = "8rem" }
"--typo-body-size" = { type = "length", min = "1rem", max = "1.75rem" }

# Computed from their source — never authored by a skin.
#
# `header.hero` here has no fixed height and only 2.5rem margin-bottom: it is a
# CONTINUOUS PAGE SURFACE with body, not a distinct band. (Contrast app-1, whose
# hero is a deliberate 43rem fixed block and therefore correctly has NO such
# derive.) When these drift apart you get banding.
[[skin.derive]]
var = "--color-hero-background"
from = "--color-background"

[[skin.derive]]
var = "--color-nav-background"
from = "--color-background"
alpha = 0.9

# One ink colour (confirmed by Alex, who authored this CSS). `.hero .button`
# fills with --color-hero-text while `.button` fills with --color-button-bg; the
# two must be the same ink or the hero button diverges from every other button.
# Both are #000000 in stock. (app-1 has them different — there the hero button
# sits on a blue band — which is why this coupling is declared per-template
# rather than assumed.)
[[skin.derive]]
var = "--color-hero-text"
from = "--color-button-bg"

# Hover is a shade of the ink, not an independent colour — otherwise the moment a
# skin moves --color-button-bg, the hover state is left behind pointing at the old
# colour. Stock is #161616 on a #000000 button, i.e. a 8.6% LIGHTENING (you cannot
# darken black). Direction is explicit rather than inferred: app-1's equivalent
# derive darkens, because its button is a mid blue.
[[skin.derive]]
var = "--color-button-hover-bg"
from = "--color-button-bg"
lighten = 0.086

# Pairs that must stay legible. These are the rules that actually set both a
# colour and a background via var() — including the dual-role cases, where a
# dark page background would otherwise silently yield dark-on-dark button text.
[[skin.contrast]]
fg = "--color-text"
bg = "--color-background"
min = 4.5

[[skin.contrast]]
fg = "--color-background"
bg = "--color-button-bg"
min = 4.5

[[skin.contrast]]
fg = "--color-hero-background"
bg = "--color-hero-text"
min = 4.5

# Families usable without a loader. A skin naming anything else must also add an
# @font-face / <link>; the journal batch emitted "Playfair Display" and "Inter"
# with nothing loading them, so they silently fell back to a generic family.
[skin.fonts]
stacks = [
    "system-ui, sans-serif",
    "ui-serif, Georgia, serif",
    "ui-monospace, SFMono-Regular, Menlo, monospace",
]

# ---------------------------------------------------------------------------
# Deterministic field mappings
# ---------------------------------------------------------------------------
# These object fields are DATA the generator already holds exactly, not content
# for the model to compose. archival-utility fills each `object.field` from the
# named lead-metadata key AFTER generation, overwriting whatever the model
# produced. The model is not trusted to copy them.
#
# Why: the App Store URL is the single most important CTA on the page, and it was
# being dropped intermittently — the model is asked to copy `app_store_url` into
# the renamed `appstore_download_link`, while the object prompt tells it twice to
# leave links empty when unsure (a guard against invented Play Store links). A
# cautious model takes the hint on the real link too. This makes it a copy, not a
# request. Same principle as [skin]'s derived variables and keep_objects: compute
# what we can, don't ask the model for it.
#
# A mapping whose metadata key is absent or empty is skipped, leaving the model's
# value (which the prompt intends to be empty). So playstore/direct download links
# stay model-controlled — there is no metadata source for them on iOS leads.

[fields]
"app.appstore_download_link" = "app_store_url"
"app.legal_email" = "email"
"app.country" = "country"
