[[story]]
title = ""
body = "Photography has been my passion for over 15 years. What started as a simple hobby with a borrowed camera has evolved into a lifelong pursuit of capturing the extraordinary in the ordinary."

[[story]]
title = ""
body = "My work spans across multiple genres—from intimate portraits that reveal the soul, to vast landscapes that showcase nature's grandeur, to street photography that captures the raw energy of urban life. Each photograph is a story waiting to be told, a moment frozen in time that speaks to the viewer's heart."

[[story]]
title = ""
body = "Based between New York and Tokyo, I've had the privilege of working with incredible clients around the world, from Fortune 500 companies to indie artists just starting their journey. My approach is simple: authenticity over perfection, emotion over technicality, and connection over composition."
after_quote = true
