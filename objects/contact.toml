[[faq]]
question = "What's your typical turnaround time?"
answer = "Turnaround times vary by project type. Portrait sessions typically take 2-3 weeks, while larger commercial or editorial projects may take 4-6 weeks. Rush delivery is available for an additional fee."

[[faq]]
question = "Do you travel for shoots?"
answer = "Absolutely! I frequently travel for projects both domestically and internationally. Travel expenses are typically added to the project quote."

[[faq]]
question = "What's included in your packages?"
answer = "Each package includes pre-production planning, the photo shoot, professional editing and retouching, and high-resolution digital files. Print rights and licensing can be discussed based on your needs."

[[faq]]
question = "How do you handle licensing and usage rights?"
answer = "Licensing is customized based on your intended use. We'll discuss the scope during our initial consultation and structure the agreement accordingly."

[[faq]]
question = "Can I see more examples of your work?"
answer = "Of course! Check out my full portfolio in the Photos section, or request a custom portfolio tailored to your project type."

