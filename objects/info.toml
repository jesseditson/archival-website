description = "Compassionate, evidence-based therapy for individuals navigating anxiety, OCD, and life transitions."
about = """
It's nice to meet you. I am a licensed therapist in Oakland, CA. I believe that, working together, you can get back the parts of your life that anxiety has crowded out. You can move from feeling stuck, tired, and confused to feeling steady, rested, and hopeful. I love this work, because I watch it help, week after week.

I support my clients by being clear and direct, offering encouragement, and making sure you always know what your next step is. Working through OCD is hard, and there is still plenty of room for laughter in our sessions.

I'll help you understand how your OCD and anxiety work, and I'll face some of those fears alongside you, until I can step back and cheer you on as you do the work. My goal is to teach you the tools, practice them with you, and then watch you use them on your own.
"""

