title = "A minute in the asters"
excerpt = "Twenty seconds of bumblebees working the New England asters on the last warm afternoon of the year."
date = "2026-11-02"
author = "Tomás Reyes"
order = 0
feature_image_alt = "A bumblebee on purple aster flowers"
content = """
The asters along the field edge are the last big meal of the year for the bumblebees. On warm afternoons in early November there are still a dozen working a single clump, slow and heavy, and in no hurry at all.

I set the camera down in the grass and let it run. This is the best twenty seconds.
"""
