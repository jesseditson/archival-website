content = """
There is a hedgerow on the walk behind my house that I must have passed a thousand times before I really looked at it. It runs for about a quarter mile between two pastures, a tangle of hawthorn, hazel, wild rose and one stubborn holly.

Ecologists have an old rule of thumb for dating a hedge: count the woody species in a thirty-yard stretch, and each one stands for roughly a century. It is crude and often wrong, but it gets you looking. On my stretch I counted six.

## Reading the layers

Hedges are planted, cut, laid, neglected and replanted. Each of those acts leaves a mark. The thick, bent stems near the ground are where someone once half-cut the trunks and laid them sideways to make the hedge stock-proof. The gaps filled with bramble are where it was left alone for a generation.

The holly, I suspect, was planted on purpose. Farmers used to leave a holly standing as a marker, or because they thought it unlucky to cut one down.

## Why it matters now

A hedge is a corridor. Small mammals, birds and insects use it to move between patches of woodland without crossing open ground. Lose the hedge and the fields on either side become islands.

I've started walking this one once a month with a notebook. Next month: who is eating the haws. Until then, the reference below is a good place to start reading about how hedges are made.
