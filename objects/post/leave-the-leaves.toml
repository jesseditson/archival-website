content = """
Every October the same sound comes up the street: leaf blowers, then rakes, then the soft thump of paper bags lined up at the curb. By November the lawns are clean and the beds are bare, and the garden has lost the one thing it was trying to give itself.

Fallen leaves are not litter. They are next year's soil, delivered free, at exactly the moment the ground needs a blanket.

## What the leaves are doing

A layer of leaves does three jobs at once. It shades the soil so frost heaves less. It holds moisture through the dry, windy weeks of early winter. And it feeds the long, slow chain of fungi, worms and insects that turns last year's growth into this year's crumb.

Many of the insects we say we want in spring spend the winter in that layer. Fireflies overwinter as larvae in leaf litter. So do a good number of moths, beetles and the ground-nesting bees that pollinate early fruit trees.

> A clean garden in November is a quiet garden in May.

## How to leave them without losing the lawn

You don't have to let the whole yard disappear. A few habits get most of the benefit:

- Rake leaves off the lawn and *onto* the beds, under shrubs and around the base of trees.
- Run a mower over thick drifts once, so they break down faster and don't mat.
- Leave the stems of perennials standing. Hollow stems are winter housing.
- Keep a corner pile for the overflow. By spring it will be half compost.

## The one exception

Diseased foliage is worth removing. If a rose or a fruit tree had black spot or scab this year, collect its leaves and bin them. Everything else can stay where it fell.

This year I left almost everything. The beds look a little wild from the kitchen window, and I've decided I like it. The soil underneath is darker than it has ever been.
