title = "Moss, the slowest lawn"
excerpt = "The shady corner where grass never took has quietly become the best-looking part of the yard."
date = "2026-09-21"
author = "Maren Holt"
order = 5
feature_image_alt = "Moss and small ferns growing on a fallen log in a green wood"
content = """
For six years I tried to grow grass under the maple by the back fence. I reseeded, I raked, I fed it. Every summer it thinned to bare dirt, and every spring the moss came back first.

This year I gave up and let the moss have it. It turned out to be the easiest decision I made in the garden.

Moss wants shade, acid soil and steady moisture, which is exactly what that corner has. It never needs mowing. It stays green through the winter. And it is soft enough to walk on barefoot.

If you have a corner like mine, try this: pull the weeds, stop feeding, and water it lightly through the first dry spell. Then leave it alone.
"""


