title = "Seed saving for the impatient"
excerpt = "You don't need a seed vault or a degree in botany. Start with three plants that make it easy."
date = "2026-10-19"
author = "Maren Holt"
order = 3
feature_image_alt = "Ears of dried multicolored corn hanging in a row"
content = """
Seed saving has a reputation for being fussy: isolation distances, hand pollination, paper bags tied over flower heads. Some crops really do need all that. Plenty don't.

If you want to try it this year, start with plants that pollinate themselves and hold their seed in a dry pod. They forgive almost every mistake.

## Three easy starters

| Plant | When to collect | How to store |
|---|---|---|
| Beans | When pods rattle | Shell, dry a week, jar |
| Lettuce | When heads go fluffy | Shake into a bag |
| Tomatoes | From a fully ripe fruit | Ferment three days, rinse, dry |

![Three butternut squash on a linen cloth](https://uploads.archival.dev/archival-template-uploads/892b2ba42eb3d65eb034ef8014afefa4812a271352b7b169dd4dc601b01cd7cb/squash.jpg)
*Squash cross easily, so save seed from them only once you're comfortable with the easy three.*

## Label everything

The single most useful habit is writing down what you saved and when. A jar of unlabeled beans is a mystery by February. I write the variety, the year and one line about how it grew.

## Keep them cool and dry

A glass jar in the back of a cupboard does the job. Most seeds stay good for three to five years that way, which is plenty of time to share them with a neighbor.
"""


