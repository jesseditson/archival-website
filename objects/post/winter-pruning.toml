title = "Winter pruning without fear"
excerpt = "Most pruning mistakes come from cutting at the wrong time, not cutting the wrong branch. Here is the order I work in."
date = "2026-08-24"
author = "Maren Holt"
order = 7
content = """
Pruning makes people nervous, and I understand why. You are cutting off part of a living thing, and you can't glue it back on.

The good news is that most fruit trees and shrubs are forgiving when they're dormant. Wait until the leaves are down and the hard frosts have passed, then work in this order:

1. Remove anything dead, damaged or diseased.
2. Remove branches that cross or rub against each other.
3. Open up the center so light and air can get in.
4. Only then, shape for size.

Stop when you've taken about a quarter of the growth. You can always cut more next year.
"""

