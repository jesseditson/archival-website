order = 6
title = "Paper Weight exhibition"
client = "Atlas Print Museum"
role = "Exhibition graphics, catalog"
discipline = "Exhibition"
year = "2022"
summary = "Graphics and a catalog for an exhibition about how much information a sheet of paper can carry."
cover_alt = "A large empty gallery hall under rows of ceiling lights"
body = """
Paper Weight brought together maps, timetables, ledgers and posters from the museum's collection. The curators wanted the exhibition graphics to step back and let the objects talk.

Wall texts are printed directly onto unbleached paper hung from rails, so the labels share a material with the work. The catalog follows the same rule: every object is shown at actual size wherever the page allows.

The show ran for five months and the catalog went into a second printing.
"""

