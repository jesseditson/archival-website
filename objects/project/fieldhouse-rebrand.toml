title = "Fieldhouse rebrand"
client = "Fieldhouse Athletic"
role = "Identity, type, art direction"
discipline = "Identity"
year = "2025"
summary = "A neighborhood gym outgrows its hand-painted sign without losing its warmth."
cover_alt = "A dark gray card catching a hard diagonal shadow"
body = """
Fieldhouse had been a boxing gym, a community hall and, for a decade, a place where half the street learned to swim. The owners wanted a name and mark that could carry all of that, on a jersey, a door and a phone screen.

We kept the slab letters from the original sign and redrew them as a compact wordmark with a heavier F that works as an icon on its own. The color is the green of the old changing-room tiles.

The system ships as a short guide, a set of templates for class schedules, and a kit of painted signage the staff can reorder themselves.
"""

