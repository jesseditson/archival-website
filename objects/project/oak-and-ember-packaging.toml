order = 3
title = "Seasonal packaging"
client = "Oak & Ember"
role = "Packaging, illustration"
discipline = "Packaging"
year = "2024"
summary = "Four boxes for four seasons, printed in two colors on recycled board."
cover_alt = "A small kraft box with a wire handle on a pale gray surface"
body = """
Oak & Ember blends tea in small batches and changes its range with the seasons. They needed packaging that could change four times a year without reprinting everything.

The answer was one box, one label size and a palette of two inks per season. A simple pattern of lines changes angle as the year turns, so the full set reads as a sequence on a shelf.

The boxes are printed on recycled board with no coating, which keeps the cost down and lets the ink sink into the fibers.
"""

