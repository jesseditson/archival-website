bio = """
I design identities, publications and signage for museums, foundations and the small companies that sit around them. Most projects start with a long conversation and a short brief, and end with a system the client can run without me.

Before going independent in 2019, I spent six years at a studio that made exhibition graphics and annual reports. I still like work that has to hold up on a wall, on a page and on a phone at the same time.
"""
