name = "Juno Halvorsen"
description = "Night Bus Home, the new record from producer Juno Halvorsen: seven late tracks of brushed drums, warm keys and the city going past the window. Listen, read the notes and see who played."
palette = "cobalt"
bio = """
Juno Halvorsen makes slow, warm records out of jazz loops, live drums and whatever the city sounds like after midnight. *Night Bus Home* is the second.

For shows, mixes and press, write to the address below.
"""
portrait_alt = "Hands on a grid of glowing drum pads in a dark studio"
