On a Tuesday morning in March, sixteen-year-old Sofia Reyes straps on a dive mask and slips backward off the gunwale of a research boat into the warm, clear water of the Florida Keys National Marine Sanctuary. Twenty feet below, a lattice of PVC pipe holds dozens of small coral fragments, each one no larger than a thumbnail, each one growing.

"That one's mine," she says, surfacing briefly to point at a fragment of staghorn coral. "Planted it six months ago. It's tripled in size."

## The Coral Restoration Foundation's Youth Program

Reyes is one of 48 students enrolled in a marine biology program at Coral Shores High School in Tavernier, Florida, that has partnered with the Coral Restoration Foundation to give teenagers hands-on experience in reef restoration. The students learn to fragment, grow, and outplant corals — the same techniques used by professional restoration scientists.

The results have been remarkable. Over the past three years, students have outplanted more than 12,000 coral fragments across degraded reef sites in the Upper Keys. Survival rates hover around 85 percent — comparable to, and in some cases exceeding, those achieved by professional teams.

## Why It Works

Marine biologists attribute the program's success to a combination of careful training, rigorous data collection, and the sheer amount of time students spend in the water. Each student logs a minimum of 40 dive hours per semester, giving them an intimate familiarity with their reef sites that even experienced researchers sometimes lack.

"These kids notice things," said Dr. Samantha Greene, a marine ecologist at NOAA who has studied the program. "They'll spot a diseased colony or a predator intrusion weeks before a quarterly survey would catch it. Frequency of observation matters enormously in reef ecology."

## A Model for Scaling

The program has attracted interest from school districts across the Caribbean and Pacific, where similar reef degradation has occurred. Pilot programs are now underway in Hawaii, the U.S. Virgin Islands, and Belize, all modeled on the Coral Shores curriculum.

For Reyes, the work is both scientific and personal. "I grew up snorkeling these reefs," she said. "They were already dying when I was a kid. The idea that I can help bring them back — that's not just biology class. That's my future."
