The shelves at Turnstile Records in Chicago's Logan Square neighborhood are stacked floor to ceiling with vinyl. On a Saturday afternoon, the store is packed — but not, notably, with the middle-aged men who dominated its early years. Today's crowd skews younger, louder, and considerably less reverent about genre purity. A 22-year-old in a vintage Radiohead shirt is flipping through a Bachata crate. Two teenagers are debating the merits of a original pressing of Fleetwood Mac's "Rumours" they clearly cannot afford.

## From Nostalgia to Culture

The vinyl revival, which began around 2007 and accelerated through the 2010s, is no longer a nostalgia project. For listeners under 30, records are not a remembrance of the past — they are simply how music lives in physical space. According to the Recording Industry Association of America, vinyl accounted for 43 percent of all physical music sales in 2025, the highest share since 1987.

"Streaming is how I find music," said Mara Espinoza, 24, a graduate student who estimates she buys three to four records a month. "But this is how I keep it."

## The Collector vs. the Listener

The shift has created a mild identity crisis in some corners of the hobby. The old-school collector — cataloguing, grading, hoarding — has been joined by a new kind of buyer who treats records more like books: worn, annotated, lent out, occasionally lost. Record store owners report a surge in used-bin traffic from younger shoppers who have no interest in sealed original pressings.

"They want records to play," said Turnstile owner Jerome Watkins. "They want to cook dinner to something and not feel bad if the sleeve gets a little greasy."

## What the Industry Is Watching

Major labels have taken notice. Pressing plants that were running years-long backlogs as recently as 2022 have expanded capacity, and several new facilities have opened in the Midwest. The question now is whether demand is durable or whether it peaks with the generation that discovered it. Most record store owners seem unconcerned. The teenagers arguing about "Rumours" are not performing nostalgia. They are making a purchase.
