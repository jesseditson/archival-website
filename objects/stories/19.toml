body = """
Nong Kham has sold pad kra pao from a cart on the same Bangkok corner for nineteen years. She arrives at five in the morning to secure her spot, fires up her wok by six, and usually sells out by early afternoon. Her cart sits across the street from a glass-fronted café that charges four times what she does for a rice dish with half the flavor. The café is always busy. So is her cart. The difference is that the café owns its space. Nong Kham does not.

## A Global Pattern

What is happening to Nong Kham is happening, in variations, to street food vendors across the world's most food-celebrated cities. In Mexico City's Roma Norte, vendors who helped define the neighborhood's identity are being pushed to its margins as commercial rents rise and municipal permit enforcement becomes selectively strict. In Brooklyn, the halal cart operators who once anchored corners have watched their customer base scatter to neighborhoods they cannot follow.

The dynamic is not new. But it has accelerated sharply as food tourism — and the media ecosystem that supports it — has turned working-class street food into a destination category. The more celebrated the food, the more valuable the real estate around it. The more valuable the real estate, the less viable the food.

## The Permit Problem

In many cities, the regulatory framework governing street vending has not changed meaningfully in decades, leaving vendors in a legal gray zone that makes them vulnerable to displacement without recourse. A vendor who has operated in the same spot for fifteen years often has no legal standing to remain there if a property owner or a city official decides to clear the sidewalk.

Advocacy groups in several cities are pushing for vending licenses tied to specific locations — a kind of informal property right that would provide stability. The proposals have met resistance from business improvement districts and commercial real estate interests, who argue that fixed street vending rights would complicate development.

## Who Gets to Stay

The sharpest version of this tension is visible in cities that have created high-end street food markets and hawker centers — curated, permanent, covered facilities designed to preserve food culture while modernizing its presentation. Singapore's hawker center model, in which the government subsidizes stalls for independent vendors, has been widely admired. It has also been criticized for selecting vendors based on marketability rather than seniority, effectively choosing which food traditions to preserve.

Back in Bangkok, Nong Kham is watching a construction project one block away. She does not know what it will be. She knows that whatever it is, it will not be for her.
