The waiting list at Earthbound Studio in Portland has 340 people on it. The average wait for a spot in a beginner wheel-throwing class is four months. The studio's owner, Keiko Mori, added two kilns in 2024 and is considering a third. She still cannot keep up with demand.

"I've been doing this for sixteen years," she said. "Nothing like this has ever happened."

## A National Pattern

Portland is not exceptional. Ceramics studios in Chicago, Atlanta, Boston, and dozens of smaller cities report similar dynamics: unprecedented demand for classes, waiting lists measured in months, and a student population that skews younger and more diverse than the hobby's traditional demographic.

The American Ceramics Society does not track recreational studio enrollment, but industry data on kiln sales and clay supply tells the story clearly. Consumer kiln sales rose 34 percent between 2023 and 2025. Several major clay manufacturers have reported the best sustained sales periods in their histories.

## Why Now

The explanations offered by studio owners, students, and the occasional researcher tend to cluster around a few themes. The post-pandemic desire for tactile, physical, offline activity has not dissipated as much as trend-watchers predicted. The popularity of "slow hobby" content on social media — which may seem paradoxical but is real — has introduced ceramics to audiences who would not previously have considered it. And there is something about the specific qualities of working with clay that seems to meet a need that other activities do not.

"You can't be on your phone while you're at the wheel," said Marcus Webb, 29, a software engineer who has been taking classes for eight months. "That's not a small thing."

## What Students Are Making

The work being produced in introductory studios is, by design, imperfect. Wobbly bowls, lopsided mugs, pots that survived the kiln with a small crack sealed by glaze. Students tend to describe these imperfections with affection rather than frustration.

Several studio owners noted that the students who stick with ceramics beyond the first few classes are often not particularly interested in getting good at it in a competitive sense. They are interested in the process. In a cultural moment defined by productivity optimization and measurable output, this is, perhaps, the most interesting thing about the ceramics boom.
