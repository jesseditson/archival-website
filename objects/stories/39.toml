Mirela Voss's last film, "Still Water," runs 104 minutes and contains 23 lines of dialogue. There is no score. There are no chase sequences, no romantic arcs, no scenes in which characters explain their feelings to each other. What there is, for the duration, is an elderly man restoring a wooden boat in a shed in Nova Scotia, in real time, with occasional departures to watch the light change over the water.

It was shown at three festivals, acquired by a small distributor, placed on a streaming platform that specializes in "slow cinema," and watched, in its first year, by approximately 280,000 people. Those 280,000 people, judging by the communities that have formed around the film on small forums and letterboxd-style platforms, are unusually devoted.

## Who Is Mirela Voss

Voss, 41, was born in Croatia, studied film in Vienna, and has been based in Halifax for the past eight years. She has made four features and seven short films. None has been reviewed by a major publication. None has needed to be: her audience finds her through word of mouth in communities that have essentially opted out of the mainstream film conversation.

"I'm not making films for people who love films," she said, in the careful English of someone who speaks it as a third language. "I'm making films for people who are tired. Who need something that is not demanding anything of them except to be present."

## The Slow Cinema Ecosystem

Voss is part of a loose international movement of filmmakers working in what critics have called "slow cinema" — a term that encompasses everything from Chantal Akerman's durational work to the recent films of Bi Gan, and that resists precise definition. What the films share is a rejection of the grammar of commercial cinema: they do not cut quickly, they do not underline emotion with music, they trust the audience to do work that mainstream filmmaking does for them.

The streaming infrastructure for this work has improved significantly in the past five years. Mubi, which began as a curated streaming service for difficult cinema, has expanded its subscriber base substantially. Several platform-native channels have emerged to serve overlapping audiences. The economics remain difficult, but they are less impossible than they were.

## What the Audience Is Looking For

The viewers who seek out films like Voss's are not, by and large, cinephiles performing sophistication. They are, if forum posts and comment threads are to be believed, people who have found that watching a man sand a piece of wood for two hours leaves them feeling something that a frenetic blockbuster does not.

What that something is resists easy description. Calm is part of it. The sense of time returned to normal speed. The feeling of having been genuinely present in an experience rather than processed through one.

Voss is currently in production on a new film. She describes it as being about bread. She will say nothing more.
