body = """
Martha Colvin has been a public librarian for 22 years. She has weathered budget cuts, a pandemic that closed her building for fourteen months, and the slow erosion of public funding that has left her branch operating with half the staff it had a decade ago.

None of it prepared her for this.

## A New Kind of Pressure

In the past two years, Colvin's library system in suburban Texas has received 347 formal challenges to books in its collection — more than the previous fifteen years combined. The challenges follow a familiar pattern: a parent or community group objects to a title, usually one dealing with race, gender identity, or sexuality. A formal complaint is filed. The book is reviewed by a committee. And increasingly, it is removed.

"We used to get maybe five challenges a year," Colvin said. "Now it's five a week. And they're organized. The same titles, the same language, filed in districts across the state."

## The Spreadsheet

The American Library Association tracked 1,269 demands to censor library books and materials in 2022 — the highest number in the organization's history. By 2025, that figure had nearly doubled. Behind the numbers is a network of national organizations that provide templates, target lists, and legal support to local chapters.

Librarians describe receiving spreadsheets of titles to challenge, sometimes numbering in the hundreds, accompanied by pre-written objection forms. The effect is a kind of bureaucratic siege — each challenge requires staff time to process, review, and respond to, regardless of its merit.

## Standing Firm

Not everyone is backing down. In Illinois, a new law makes it illegal for publicly funded libraries to ban books. Colorado and Minnesota have passed similar protections. And a growing coalition of librarians, authors, and free-speech advocates is mounting legal challenges to removal orders.

"A library is not a grocery store where you only stock what sells," said Dr. Emily Drabinski, president of the ALA. "It's a public trust. Our job is to provide access, not to curate according to the loudest voices in the room."

For Colvin, the fight is personal. "Every book I put back on the shelf is a small act of defiance," she said. "And I plan to keep doing it until they carry me out of here."
